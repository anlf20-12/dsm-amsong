<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSM 말씀 암송</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1f5c55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말씀 암송">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#1c2a2a; --muted:#5f6d6b; --line:#d9dfdb;
  --accent:#1f5c55; --accent-soft:#dcebe7; --gold:#a8782a; --gold-soft:#f5ebd6;
  --verse:"Gowun Batang","Noto Serif KR",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1b2322; --ink:#e6ecea; --muted:#9aa8a5; --line:#2c3836;
  --accent:#6fbfb3; --accent-soft:#1f3532; --gold:#d9ad5e; --gold-soft:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1b2322; --ink:#e6ecea; --muted:#9aa8a5; --line:#2c3836;
  --accent:#6fbfb3; --accent-soft:#1f3532; --gold:#d9ad5e; --gold-soft:#33291a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px}
.brand{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:0}
.brand small{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.brand b{font-family:var(--verse);font-size:22px;font-weight:700}
.chip{padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
h2{font-family:var(--verse);font-size:20px;margin:4px 0 12px;text-wrap:balance}
.books{display:grid;gap:10px}
.book{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.book .no{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-family:var(--verse);font-weight:700;font-size:18px}
.book.empty .no{background:var(--line);color:var(--muted)}
.book .name{font-weight:600;font-size:16px}
.book .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}
.count b{display:block;font-size:17px;color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;padding:6px 0}
.vlist{display:grid;gap:2px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{display:grid;grid-template-columns:42px 1fr 30px;gap:10px;align-items:center;text-align:left;background:var(--surface);padding:12px 14px}
.vrow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.vrow .t{font-weight:600;min-width:0}
.vrow .r{font-size:12px;color:var(--muted)}
.tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.tick.on{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.modes button{padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;min-height:300px;display:flex;flex-direction:column;gap:14px}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.card .ref{font-family:var(--verse);font-size:28px;font-weight:700;color:var(--accent);line-height:1.2}
.card .title{font-size:15px;font-weight:600}
.verse{font-family:var(--verse);font-size:19px;line-height:2;word-break:keep-all;flex:1}
.reveal{flex:1;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);padding:24px;font-size:14px}
.w{display:inline}
.blank{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--gold);color:transparent;line-height:1.4;margin:0 1px;cursor:pointer;border-radius:2px}
.blank.open{color:var(--gold);border-bottom-color:transparent;background:var(--gold-soft)}
.hint{cursor:pointer;border-radius:3px}
.hint .rest{color:var(--line);letter-spacing:.05em}
.hint.open .rest{color:var(--gold)}
.write{font-family:var(--verse);font-size:17px;line-height:1.8;width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
.result{font-family:var(--verse);font-size:18px;line-height:2;word-break:keep-all}
.result .ok{color:var(--accent)}
.result .miss{color:var(--gold);background:var(--gold-soft);border-radius:2px;font-weight:700}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.score b{font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.legend .miss{color:var(--gold);background:var(--gold-soft);padding:0 4px;border-radius:2px;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface);font-weight:600}
.nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px}
.nav .btn{padding:12px 6px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500}
tr.me td{color:var(--accent);font-weight:600}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px;overflow-x:auto}
.exgroup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.exgroup h3{margin:0;font-family:var(--verse);font-size:17px}
.exrow{display:flex;flex-wrap:wrap;gap:8px}
.exbtn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.exbtn small{font-size:11px;color:var(--muted)}
.exbtn.big{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:600}
.exbtn.big small{color:var(--surface);opacity:.85;font-weight:400}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:6px}
.nums button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums;display:grid;justify-items:center;line-height:1.3}
.nums button small{font-size:10px;color:var(--gold)}
.nums button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.pickhd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
.linkbtn{font-size:12px;color:var(--accent);font-weight:500;padding:4px 0}
details.sub summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 12px}
.prog i{display:block;height:100%;background:var(--gold)}
.resrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.resrow .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px}
.pill{font-variant-numeric:tabular-nums;font-weight:600;padding:2px 9px;border-radius:999px;font-size:12px;white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--gold-soft);color:var(--gold)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabbar button{padding:12px;font-size:14px;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:end center;z-index:20;padding:16px}
.sheet[hidden]{display:none!important}
.sheet .panel{background:var(--surface);border-radius:18px;padding:22px;width:100%;max-width:480px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet input{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}.blank,.hint{transition:background .2s}}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <button class="brand" data-go="home" aria-label="목차로 가기"><small>DSM 제자훈련</small><b>말씀 암송</b></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar">
  <button id="tabHome" aria-current="page">암송</button>
  <button id="tabTest">시험</button>
</nav>

<script>
const BOOKS=[
{no:1,name:"믿음을 주소서",v:[
["천지 창조","창1:1","태초에 하나님이 천지를 창조하시니라"],
["최초의 복음","창3:15하","여자의 후손은 네 머리를 상하게 할 것이요 너는 그의 발꿈치를 상하게 할 것이니라"],
["모든 사람은 죄인","롬3:23","모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니"],
["죄의 결과","롬6:23","죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라"],
["죽은 후의 심판","히9:27","한번 죽는 것은 사람에게 정해진 것이요 그 후에는 심판이 있으리니"],
["하나님의 사랑","요3:16","하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라"],
["사랑의 확증","롬5:8","우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라"],
["구원의 유일한 길","행4:12","다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라 하였더라"],
["그리스도를 영접함","계3:20","볼지어다 내가 문 밖에 서서 두드리노니 누구든지 내 음성을 듣고 문을 열면 내가 그에게로 들어가 그와 더불어 먹고 그는 나와 더불어 먹으리라"],
["영접하는 자의 축복","요1:12","영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니"]]},
{no:2,name:"구원을 향하여",v:[
["구원의 방법","롬10:10","사람이 마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이르느니라"],
["예수님이 오신 이유","요10:10","도둑이 오는 것은 도둑질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라"],
["새롭게 됨","고후5:17","그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다"],
["신앙의 성장","벧전2:2","갓난 아기들 같이 순전하고 신령한 젖을 사모하라 이는 그로 말미암아 너희로 구원에 이르도록 자라게 하려 함이라"],
["모여 교제함","히10:24-25","서로 돌아보아 사랑과 선행을 격려하며 모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그 날이 가까움을 볼수록 더욱 그리하자"],
["성령의 내주하심","고전12:3","그러므로 내가 너희에게 알리노니 하나님의 영으로 말하는 자는 누구든지 예수를 저주할 자라 하지 아니하고 또 성령으로 아니하고는 누구든지 예수를 주시라 할 수 없느니라"],
["믿는 자들에게 따르는 표적","막16:17-18","믿는 자들에게는 이런 표적이 따르리니 곧 그들이 내 이름으로 귀신을 쫓아내며 새 방언을 말하며 뱀을 집어올리며 무슨 독을 마실지라도 해를 받지 아니하며 병든 사람에게 손을 얹은즉 나으리라 하시더라"],
["좋은 것을 주시는 하나님","마7:11","너희가 악한 자라도 좋은 것으로 자식에게 줄 줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐"],
["먼저 구할 것","마6:33","그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"],
["기도의 자세","빌4:6-7","아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라"],
["큰 비전을 가짐","시81:10","나는 너를 애굽 땅에서 인도하여 낸 여호와 네 하나님이니 네 입을 크게 열라 내가 채우리라 하였으나"],
["할 수 있다는 믿음","막9:23","예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능히 하지 못할 일이 없느니라 하시니"],
["구원은 하나님의 선물","엡2:8-9","너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라"],
["모든 것을 주심","롬8:32","자기 아들을 아끼지 아니하시고 우리 모든 사람을 위하여 내주신 이가 어찌 그 아들과 함께 모든 것을 우리에게 주시지 아니하겠느냐"],
["그리스도 고난의 의미","사53:5-6","그가 찔림은 우리의 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 그가 채찍에 맞으므로 우리는 나음을 받았도다 우리는 다 양 같아서 그릇 행하여 각기 제 길로 갔거늘 여호와께서는 우리 모두의 죄악을 그에게 담당시키셨도다"],
["가르치는 자를 접대함","갈6:6","가르침을 받는 자는 말씀을 가르치는 자와 모든 좋은 것을 함께 하라"],

  ["Home","Test"].forEach(k=>$("#tab"+k).setAttribute("aria-current",k===tab?"page":"false"));
  const v=$("#view");

  return `<h2>목차</h2><div class="books">${BOOKS.map(b=>{
    const n=b.v.length,d=doneIn(b),pct=n?Math.round(d/n*100):0;
    return `<button class="book${n?"":" empty"}" data-book="${b.no}">
      <span class="no">${ROMAN[b.no]}</span>
      <span style="min-width:0"><span class="name">${b.name}</span>
        <span class="sub" style="display:block">${n?`제${b.no}권 · ${n}구절`:"구절 준비 중"}</span>
        ${n?`<span class="bar"><i style="width:${pct}%"></i></span>`:""}</span>
      <span class="count">${n?`<b>${d}</b>/ ${n}`:""}</span></button>`}).join("")}</div>
    <p class="note" style="margin-top:16px">외운 구절 <b>${totalDone()}</b> / ${all} · 구절을 누르면 카드, 빈칸, 첫 글자, 쓰기 네 가지 방법으로 연습할 수 있어요.</p>`;
}
function bookHTML(no){

    <span class="n">${ROMAN[no]}-${i+1}</span>
    <span style="min-width:0"><span class="t">${esc(x[0])}</span><span class="r" style="display:block">${esc(x[1])}</span></span>
    <span class="tick${S.done[vid(no,i)]?" on":""}">✓</span></button>`).join("")}</div>`
  :`<p class="note">이 목차의 구절은 아직 들어가지 않았어요.</p>`}`;
}

  const ws=words(text);
  if(mode==="blank"){
    const r=rng(key.split("").reduce((a,c)=>a*31+c.charCodeAt(0),7)+shuffle*977);
    let pick=ws.map(()=>r()<0.38);if(!pick.some(Boolean))pick[Math.floor(ws.length/2)]=true;
    return `<div class="verse">${ws.map((w,i)=>pick[i]?`<span class="blank" data-w="${i}">${esc(w)}</span>`:`<span class="w">${esc(w)}</span>`).join(" ")}</div>`;
  }
  return `<div class="verse">${ws.map((w,i)=>{const ch=[...w];return `<span class="hint" data-w="${i}">${esc(ch[0])}<span class="rest">${ch.slice(1).map(c=>`<span data-c="${esc(c)}">○</span>`).join("")}</span></span>`}).join(" ")}</div>`;
}
let revealed={};
const drafts={},graded={};
function writeBody(text,key){
  const g=graded[key];
  if(!g)return `<label for="writeInput" style="font-size:13px;color:var(--muted)">장절과 제목만 보고 본문을 직접 써 보세요. 띄어쓰기와 문장부호는 채점하지 않아요.</label>
    <textarea class="write" id="writeInput" placeholder="여기에 구절을 쓰세요">${esc(drafts[key]||"")}</textarea>
    <div class="tools"><button class="btn primary" data-act="grade">채점하기</button></div>`;
  const pct=Math.round(g.ok/g.total*100);
  return `<div class="score"><b>${pct}점</b><span>${g.total}글자 중 ${g.ok}글자 맞음${g.extra?` · 틀리거나 더 쓴 글자 ${g.extra}`:""}</span></div>
    ${pct===100&&!g.extra?`<p class="note" style="margin:0">완벽해요! 아래 "외웠어요"를 눌러 기록하세요.</p>`:`<div class="legend" style="font-size:12px;color:var(--muted)"><span class="miss">표시</span>된 글자가 빠졌거나 틀린 곳이에요.</div>`}
    <div class="result">${g.html}</div>
    <div style="font-size:13px;color:var(--muted)">내가 쓴 글: ${esc(drafts[key]||"")}</div>
    <div class="tools"><button class="btn primary" data-act="rewrite">다시 쓰기</button></div>`;
}
function grade(text,typed){
  const norm=c=>/[\s.,!?·'"“”‘’()]/.test(c);
  const A=[...text],a=[],ai=[];A.forEach((c,i)=>{if(!norm(c)){a.push(c);ai.push(i)}});
  const b=[...typed].filter(c=>!norm(c));
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Set();let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){hit.add(ai[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const html=A.map((c,k)=>norm(c)?esc(c):`<span class="${hit.has(k)?"ok":"miss"}">${esc(c)}</span>`).join("");
  return{ok:hit.size,total:n,extra:m-hit.size,html};
}
document.addEventListener("input",e=>{if(e.target.id==="writeInput"&&route.v==="card")drafts[vid(route.b,route.i)]=e.target.value;if(e.target.id==="examInput"&&exam)exam.ans[exam.pos]=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="shuf"){S.shuf=e.target.checked;saveLocal()}});
function cardHTML(no,i){
  const b=BOOKS[no-1],x=b.v[i],key=vid(no,i),on=!!S.done[key];
  const m=S.mode;
  return `<button class="back" data-go="book">‹ ${b.name}</button>
  <div class="modes" role="group" aria-label="연습 방법">
    <button data-mode="card" aria-pressed="${m==="card"}">카드</button>
    <button data-mode="blank" aria-pressed="${m==="blank"}">빈칸</button>
    <button data-mode="first" aria-pressed="${m==="first"}">첫 글자</button>
    <button data-mode="write" aria-pressed="${m==="write"}">쓰기</button>
  </div>
  <article class="card">
    <div class="meta"><span>${ROMAN[no]}-${i+1} · ${b.name}</span><span>${i+1} / ${b.v.length}</span></div>
    <div><div class="ref">${esc(x[1])}</div><div class="title">${esc(x[0])}</div></div>
    ${verseBody(x[2],m,key)}
    ${m==="blank"||m==="first"?`<div class="tools"><button class="btn" data-act="all">모두 보기</button>${m==="blank"?`<button class="btn" data-act="shuffle">빈칸 바꾸기</button>`:""}</div>`:""}
  </article>
  <div class="nav">
    <button class="btn" data-act="prev" ${i===0?"disabled style='opacity:.4'":""}>‹ 이전</button>
    <button class="btn ${on?"gold":"primary"}" data-act="done">${on?"✓ 외웠어요":"외웠어요"}</button>
    <button class="btn" data-act="next" ${i===b.v.length-1?"disabled style='opacity:.4'":""}>다음 ›</button>
  </div>`;
}
let exam=null;
const scoreOf=g=>Math.round(g.ok/Math.max(g.total,g.ok+g.extra,1)*100);
function testHTML(){
  const last=k=>{const r=S.tests&&S.tests[k];return r!=null?r:null};
  return `<h2>시험</h2>
  <p class="note" style="margin:0 0 12px">장절과 제목을 보고 본문을 쓰는 시험이에요. 다 쓴 뒤 제출하면 한꺼번에 채점해요.</p>
  <label class="switch"><input type="checkbox" id="shuf" ${S.shuf?"checked":""}> 문제 순서 섞기</label>
  <div class="books" style="margin-top:12px">
  ${BOOKS.filter(b=>b.v.length).map(b=>{
    const n=b.v.length,ranges=[];
    if(n>12)for(let s=0;s<n;s+=12)ranges.push([s,Math.min(n,s+12)]);
    const tag=k=>{const r=last(k);return r!=null?` · 최근 ${r}점`:""};
    return `<section class="exgroup"><h3>${ROMAN[b.no]}. ${b.name}</h3>
    <div class="exrow"><button class="exbtn big" data-exam="${b.no}:0:${n}">전체 시험<small>${n}구절${tag(b.no+":0:"+n)}</small></button>
    ${(()=>{const per=PER[b.no]||1,out=[];for(let s=0,k=1;s<n;s+=per,k++){const e=Math.min(n,s+per),ky=b.no+":"+s+":"+e,r=last(ky);out.push(`<button class="exbtn" data-exam="${ky}">${k}과<small>${ROMAN[b.no]}-${s+1}${e-s>1?"~"+e:""}${r!=null?` · ${r}점`:""}</small></button>`)}return out.join("")})()}</div>
    ${ranges.length?`<details class="sub"><summary>12구절씩 시험</summary><div class="exrow" style="margin-top:6px">${ranges.map(([s,e])=>`<button class="exbtn" data-exam="${b.no}:${s}:${e}">${ROMAN[b.no]}-${s+1} ~ ${e}<small>${e-s}구절${tag(b.no+":"+s+":"+e)}</small></button>`).join("")}</div></details>`:""}
    </section>`}).join("")}</div>`;
}
const pick=new Set();
function pickLabel(){return pick.size?`고른 ${pick.size}구절 시험 보기`:"구절을 골라 주세요"}
function syncPick(){document.querySelectorAll("[data-pick]").forEach(x=>x.setAttribute("aria-pressed",pick.has(x.dataset.pick)));const s=$("#pickStart");if(s)s.textContent=pickLabel()}
function startExam(key,items,label){
  if(!items){
    const [bn,s,e]=key.split(":").map(Number),b=BOOKS[bn-1],n=b.v.length;
    items=[];for(let i=s;i<e;i++)items.push({b:bn,i});
    const per=PER[bn]||1;
    label=b.name+" "+(e-s===n?"전체 시험":(s%per===0&&(e-s===per||e===n)&&e-s<=per)?`${s/per+1}과 시험`:`${ROMAN[bn]}-${s+1}~${e} 시험`);
  }
  items=items.slice();
  if(S.shuf&&items.length>1)for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  exam={key,label,items,ans:[],pos:0,warn:false,res:null};
  route={v:"exam"};render();focusExam();
}
function focusExam(){setTimeout(()=>{const w=$("#examInput");if(w)w.focus()},40)}
function examHTML(){
  const N=exam.items.length,p=exam.pos,it=exam.items[p],x=BOOKS[it.b-1].v[it.i];
  const blanks=exam.items.filter((_,k)=>!(exam.ans[k]||"").trim()).length;
  return `<button class="back" data-act="exquit">‹ 시험 목록</button>
  <div style="font-size:13px;color:var(--muted)">${esc(exam.label)}</div>
  <div class="prog"><i style="width:${(p+1)/N*100}%"></i></div>
  <article class="card" style="min-height:0">
    <div class="meta"><span>문제 ${p+1} / ${N}</span><span>${ROMAN[it.b]}-${it.i+1}</span></div>
    <div><div class="ref">${esc(x[1])}</div><div class="title">${esc(x[0])}</div></div>
    <textarea class="write" id="examInput" placeholder="본문을 쓰세요">${esc(exam.ans[p]||"")}</textarea>
  </article>
  ${exam.warn&&blanks?`<p class="note" style="margin:12px 0 0">아직 안 쓴 문제가 ${blanks}개 있어요. 그대로 제출하려면 한 번 더 누르세요.</p>`:""}
  <div class="nav" style="grid-template-columns:1fr 2fr">
    <button class="btn" data-act="exprev" ${p===0?"disabled style='opacity:.4'":""}>‹ 이전</button>
    ${p===N-1?`<button class="btn gold" data-act="exsubmit">제출하고 채점하기</button>`:`<button class="btn primary" data-act="exnext">다음 문제 ›</button>`}
  </div>`;
}
function submitExam(){
  const blanks=exam.items.filter((_,k)=>!(exam.ans[k]||"").trim()).length;
  if(blanks&&!exam.warn){exam.warn=true;render();return}
  exam.res=exam.items.map((it,k)=>{const g=grade(BOOKS[it.b-1].v[it.i][2],(exam.ans[k]||"").trim());return{...it,g,sc:scoreOf(g),ans:exam.ans[k]||""}});
  exam.total=Math.round(exam.res.reduce((n,r)=>n+r.sc,0)/exam.res.length);
  S.tests=S.tests||{};if(exam.key)S.tests[exam.key]=exam.total;
  S.lastTest={label:exam.label,score:exam.total,at:Date.now()};
  saveLocal();pushProgress();route={v:"result"};render();
}
function resultHTML(){
  const r=exam.res,perfect=r.filter(x=>x.sc===100),wrong=r.filter(x=>x.sc<100);
  const toMark=perfect.filter(x=>!S.done[vid(x.b,x.i)]).length;
  return `<button class="back" data-act="exquit">‹ 시험 목록</button>
  <h2>${esc(exam.label)} 결과</h2>
  <div class="card" style="min-height:0"><div class="score"><b>${exam.total}점</b><span>${r.length}구절 중 ${perfect.length}구절 만점</span></div></div>
  <div class="tools" style="margin:12px 0">
    ${wrong.length?`<button class="btn primary" data-act="exwrong">틀린 구절만 다시 (${wrong.length})</button>`:""}
    <button class="btn" data-act="exretry">처음부터 다시</button>
    ${toMark?`<button class="btn gold" data-act="exmark">만점 구절 외움 표시 (${toMark})</button>`:""}
  </div>
  <div style="display:grid;gap:8px">${r.map(x=>{const v=BOOKS[x.b-1].v[x.i];return `<div class="resrow">
    <div class="hd"><span><b>${ROMAN[x.b]}-${x.i+1} ${esc(v[1])}</b> <span style="color:var(--muted)">${esc(v[0])}</span></span><span class="pill ${x.sc===100?"good":"bad"}">${x.sc}점</span></div>
    ${x.sc<100?`<div class="result" style="font-size:16px">${x.g.html}</div><div style="font-size:12px;color:var(--muted)">내가 쓴 글: ${x.ans.trim()?esc(x.ans):"(비어 있음)"}</div>`:""}</div>`}).join("")}</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-w]");if(!t)return;
  if(t.dataset.book){const b=+t.dataset.book;route={v:"book",b};render();return}
  if(t.dataset.go==="home"){route={v:"home"};render();return}
  if(t.dataset.go==="book"){route={v:"book",b:route.b};render();return}
  if(t.dataset.exam){startExam(t.dataset.exam);return}
  if(t.dataset.pick){const k=t.dataset.pick;pick.has(k)?pick.delete(k):pick.add(k);syncPick();return}
  if(t.dataset.pickall){const no=+t.dataset.pickall,ks=BOOKS[no-1].v.map((_,i)=>no+"-"+i),all=ks.every(k=>pick.has(k));ks.forEach(k=>all?pick.delete(k):pick.add(k));syncPick();return}
  if(t.dataset.verse){S.mode="card";saveLocal();route={v:"card",b:route.b,i:+t.dataset.verse};revealed={};render();return}
  if(t.dataset.mode){S.mode=t.dataset.mode;saveLocal();revealed={};render();return}
  if(t.classList.contains("blank")){t.classList.toggle("open");return}
  if(t.classList.contains("hint")){openHint(t,!t.classList.contains("open"));return}
  const a=t.dataset.act;if(!a)return;
  const key=route.v==="card"?vid(route.b,route.i):null;
  if(a==="pickclear"){pick.clear();syncPick();return}
  if(a==="pickstart"){if(!pick.size)return;const items=[...pick].map(k=>{const [b,i]=k.split("-").map(Number);return{b,i}}).sort((x,y)=>x.b-y.b||x.i-y.i);startExam(null,items,`골라서 시험 (${items.length}구절)`);return}
  if(a==="exquit"){route={v:"test"};render();return}
  if(a==="exnext"){exam.pos++;render();focusExam();return}
  if(a==="exprev"&&exam.pos>0){exam.pos--;render();focusExam();return}
  if(a==="exsubmit"){submitExam();return}
  if(a==="exretry"){startExam(exam.key,exam.items,exam.label);return}
  if(a==="exwrong"){startExam(null,exam.res.filter(x=>x.sc<100).map(x=>({b:x.b,i:x.i})),exam.label.replace(/ \(틀린 구절\)$/,"")+" (틀린 구절)");return}
  if(a==="exmark"){exam.res.filter(x=>x.sc===100).forEach(x=>S.done[vid(x.b,x.i)]=true);saveLocal();pushProgress();render();return}
  if(a==="show"){revealed[key]=true;render()}
  else if(a==="grade"){const t=(drafts[key]||"").trim();if(!t){$("#writeInput").focus();return}graded[key]=grade(BOOKS[route.b-1].v[route.i][2],t);render()}
  else if(a==="rewrite"){delete graded[key];drafts[key]="";render();setTimeout(()=>{const w=$("#writeInput");if(w)w.focus()},30)}
  else if(a==="all"){document.querySelectorAll(".blank").forEach(x=>x.classList.add("open"));document.querySelectorAll(".hint").forEach(x=>openHint(x,true))}
  else if(a==="shuffle"){shuffle++;render()}
  else if(a==="prev"&&route.i>0){route.i--;revealed={};render()}
  else if(a==="next"&&route.i<BOOKS[route.b-1].v.length-1){route.i++;revealed={};render()}
  else if(a==="done"){if(S.done[key])delete S.done[key];else S.done[key]=true;saveLocal();render();pushProgress()}
});
function openHint(el,open){el.classList.toggle("open",open);el.querySelectorAll("[data-c]").forEach(c=>c.textContent=open?c.dataset.c:"○")}
$("#tabHome").onclick=()=>{route={v:"home"};render()};
$("#tabTest").onclick=()=>{route={v:"test"};render()};

function pushProgress(){}

render();
</script>
